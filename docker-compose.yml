services:
  couchdb:
    image: couchdb:3
    container_name: couchdb
    ports:
      - "5984:5984"
    environment:
      COUCHDB_USER: ${COUCHDB_USER:-admin}
      COUCHDB_PASSWORD: ${COUCHDB_PASSWORD:?définir COUCHDB_PASSWORD dans .env}
    volumes:
      - couchdb_data:/opt/couchdb/data

volumes:
  couchdb_data:
